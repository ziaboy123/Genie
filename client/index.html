<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Genie</title>
  <meta name="description" content="A wishlist with one link. Send it to family and friends, and they pick what to get you without doubling up.">
  <!-- shops never learn which list someone came from -->
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f5ff">
  <meta name="color-scheme" content="light">
  <!-- link previews (WhatsApp, iMessage, Discord, LinkedIn): a share page swaps in its own title and description.
       No og:url here, so a shared list's preview is never folded into the home page's. -->
  <meta property="og:site_name" content="Genie">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Genie: wishlists with one link">
  <meta property="og:description" content="Make a wishlist, send one link, and family and friends pick what to get you without doubling up.">
  <meta property="og:image" content="https://daniyalzia.co.uk/genie/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Genie: Wish for it. They'll grant it.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
